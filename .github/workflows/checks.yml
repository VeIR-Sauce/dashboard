name: Check VeIR progress tracker

on:
  push:
    branches: [main, codex/veir-progress]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check the harness and dashboard model
        run: |
          python -m unittest discover -s tests_harness -v
          node --test tests_harness/web_model.test.cjs
      - name: Verify generated fixtures and published files
        run: |
          python scripts/generate_cases.py
          python -m veir_suite validate
          python -m veir_suite site --history evidence --out docs
          git diff --exit-code -- cases requirements/registry.json docs
      - name: Exercise the rendered page
        shell: bash
        run: |
          export CHROMIUM
          CHROMIUM=$(command -v chromium || command -v google-chrome)
          node scripts/check_browser.cjs docs
      - name: Keep the reviewable site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: veir-progress-preview
          path: docs
          if-no-files-found: error
