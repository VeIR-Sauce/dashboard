name: Measure and publish LLVM parsing

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      measure:
        description: Measure current VeIR (disable to republish saved history only)
        type: boolean
        default: true
  push:
    branches: [codex/veir-progress]
    paths: ['web/**', 'veir_suite/site.py', '.github/workflows/parsing.yml']

permissions:
  contents: read

# History and Pages have a single writer, including manual and UI-only runs.
concurrency:
  group: parsing-publication
  cancel-in-progress: false

jobs:
  measure:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.site.outputs.ready }}
    env:
      LEAN_NUM_THREADS: '2'
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check harness and presentation
        run: |
          python -m unittest discover -s tests_harness -v
          node --test tests_harness/web_model.test.cjs
      - name: Restore permanent history
        run: python scripts/parsing_history.py restore
      - name: Select measurement mode and pinned reference
        id: mode
        env:
          RUN_MEASUREMENT: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.measure) }}
        run: |
          echo "measure=$RUN_MEASUREMENT" >> "$GITHUB_OUTPUT"
          python -c 'import json, os; print("revision=" + json.load(open("profiles/ci.json"))["llvm_revision"], file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - name: Check out current upstream VeIR
        if: steps.mode.outputs.measure == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: opencompl/veir
          ref: main
          path: .artifacts/veir
          submodules: recursive
          persist-credentials: false
      - name: Identify source and toolchain
        if: steps.mode.outputs.measure == 'true'
        id: veir
        run: |
          echo "revision=$(git -C .artifacts/veir rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "toolchain=$(cat .artifacts/veir/lean-toolchain)" >> "$GITHUB_OUTPUT"
      - name: Restore pinned MLIR reference
        if: steps.mode.outputs.measure == 'true'
        id: reference
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .artifacts/reference/bin
            .artifacts/reference/revision
          key: parsing-reference-${{ runner.os }}-${{ runner.arch }}-${{ steps.mode.outputs.revision }}-${{ hashFiles('scripts/build_reference.sh') }}
      - name: Build pinned MLIR reference
        if: steps.mode.outputs.measure == 'true'
        env:
          REFERENCE_TOOLS: mlir-opt
          BUILD_JOBS: '2'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build elan
          bash scripts/build_reference.sh .artifacts/reference
          elan toolchain install "${{ steps.veir.outputs.toolchain }}"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Save reference before measuring
        if: steps.mode.outputs.measure == 'true' && steps.reference.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .artifacts/reference/bin
            .artifacts/reference/revision
          key: ${{ steps.reference.outputs.cache-primary-key }}
      - name: Restore VeIR build
        if: steps.mode.outputs.measure == 'true'
        id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .artifacts/veir/.lake
            .artifacts/veir/ExArray/.lake
            .artifacts/veir/lean-ctrees/.lake
          key: parsing-veir-${{ runner.os }}-${{ hashFiles('.artifacts/veir/lean-toolchain', '.artifacts/veir/lake-manifest.json') }}-${{ steps.veir.outputs.revision }}
          restore-keys: parsing-veir-${{ runner.os }}-${{ hashFiles('.artifacts/veir/lean-toolchain', '.artifacts/veir/lake-manifest.json') }}-
      - name: Build current parser
        if: steps.mode.outputs.measure == 'true'
        working-directory: .artifacts/veir
        run: lake build veir-opt
      - name: Save VeIR build
        if: steps.mode.outputs.measure == 'true' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .artifacts/veir/.lake
            .artifacts/veir/ExArray/.lake
            .artifacts/veir/lean-ctrees/.lake
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Measure the fixed parsing cases
        if: steps.mode.outputs.measure == 'true'
        id: parsing
        continue-on-error: true
        run: python -u -m veir_suite parse --veir .artifacts/veir --mlir-opt .artifacts/reference/bin/mlir-opt --revalidate-reference
      - name: Record receipts and prepare publication
        id: site
        run: |
          # An incomplete receipt is retained and displayed, never treated as progress.
          python scripts/parsing_history.py publish
          python -m veir_suite site --history .artifacts/measurement-history/evidence --out site-output
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Keep parser diagnostics
        if: ${{ !cancelled() && steps.mode.outputs.measure == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parsing-diagnostics
          path: .artifacts/parsing
          if-no-files-found: warn
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site-output
      - name: Require a complete measurement
        if: steps.mode.outputs.measure == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          from veir_suite.parsing import validate_parsing
          from veir_suite.model import read_json
          reports = list(Path('.artifacts/parsing').glob('*/parsing.json'))
          if len(reports) != 1 or not validate_parsing(read_json(reports[0]))['complete']:
              raise SystemExit('Missing or incomplete parsing measurement; inspect diagnostics')
          PY

  pages:
    if: ${{ !cancelled() && needs.measure.outputs.ready == 'true' }}
    needs: measure
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy measured history
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
